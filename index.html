<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Murdoku</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Murdoku: un puzle diario de asesinatos. Coloca a cada sospechoso en el plano de la casa según lo que declara y pilla a quien estuvo a solas con la víctima.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Libre+Franklin:wght@400;500;600;700;800;900&display=swap">
<style>
/* Concepto: juego diario de fichas planas. Cabecera con filete, plano de fichas por habitaciones,
   teclado de sospechosos abajo, colores lisos y nada de adornos. */
:root {
  --bg: #ffffff;
  --fg: #1a1a1b;
  --muted: #787c7e;
  --line: #d3d6da;
  --line-2: #878a8c;
  --surface: #f6f7f8;
  --key: #d3d6da;
  --key-fg: #1a1a1b;
  --green: #6aaa64;
  --yellow: #c9b458;
  --red: #d8524b;
  --toast-bg: #1a1a1b;
  --toast-fg: #ffffff;
  --overlay: rgba(255, 255, 255, .6);
  --tile-line: rgba(26, 26, 27, .09);
  --block-shade: rgba(26, 26, 27, .14);
  --shade-gray: #e9eaec;
  --icon: rgba(26, 26, 27, .5);
  --icon-block: #1a1a1b;
  --victim: #1a1a1b;
  --victim-fg: #ffffff;
  --r0: #cfe2f6; --r1: #f8d6b4; --r2: #cde9c9; --r3: #f4cddf; --r4: #e4e0a6; --r5: #dad0f3; --r6: #f6e59c; --r7: #c3e9e3;
  --f-wood: #c08a55; --f-wood-d: #8e5d36; --f-hi: rgba(255,255,255,.35); --f-seat: #6aaa64;
  --f-fab: #e2685a; --f-fab-d: #b94c40; --f-fab-l: #f08a7c; --f-sheet: #fbfaf6; --f-sheet-d: #d9dde3;
  --f-blanket: #5b8fd1; --f-blanket-d: #3f6fb0; --f-rug: #b8434f; --f-rug-d: #8a2d39; --f-gold: #e9c25a;
  --f-leaf: #5aa552; --f-leaf-d: #3b8040; --f-leaf-l: #78bd66; --f-pot: #d2713f; --f-pot-d: #a8532c;
  --f-shelf-in: #5e3d24; --f-book1: #e2685a; --f-book2: #5b8fd1; --f-book3: #e9c25a; --f-book4: #6aaa64; --f-book5: #9b6bd1;
  --f-piano: #2e2a30; --f-piano-hi: #4d4652; --f-porc: #fbfaf6; --f-porc-d: #ccd5de; --f-metal: #c9a74a; --f-water: #a8d8f2;
  --f-flower: #dc5694; --f-vase: #5b8fd1;
  --p0: #6aaa64; --p1: #c9b458; --p2: #4f86d1; --p3: #ee7034; --p4: #9b6bd1; --p5: #dc5694; --p6: #2fa898; --p7: #8a6a5c; --p8: #6e7377;

  --font-ui: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --font-title: "Alfa Slab One", Rockwell, "Roboto Slab", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121213; --fg: #f8f8f8; --muted: #818384; --line: #3a3a3c; --line-2: #565758; --surface: #1c1c1e;
    --key: #818384; --key-fg: #ffffff; --green: #538d4e; --yellow: #b59f3b; --red: #e0625b;
    --toast-bg: #f8f8f8; --toast-fg: #121213; --overlay: rgba(0, 0, 0, .55);
    --tile-line: rgba(255, 255, 255, .08); --block-shade: rgba(0, 0, 0, .38); --shade-gray: #2c2c2e;
    --icon: rgba(255, 255, 255, .5); --icon-block: #f8f8f8; --f-piano: #4a4250; --f-piano-hi: #6a6175; --f-shelf-in: #3c2716; --f-hi: rgba(255,255,255,.2); --victim: #f8f8f8; --victim-fg: #121213;
    --r0: #2b4866; --r1: #5d4128; --r2: #2e5636; --r3: #5a3247; --r4: #4c4a24; --r5: #403866; --r6: #5d5122; --r7: #225651;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121213; --fg: #f8f8f8; --muted: #818384; --line: #3a3a3c; --line-2: #565758; --surface: #1c1c1e;
  --key: #818384; --key-fg: #ffffff; --green: #538d4e; --yellow: #b59f3b; --red: #e0625b;
  --toast-bg: #f8f8f8; --toast-fg: #121213; --overlay: rgba(0, 0, 0, .55);
  --tile-line: rgba(255, 255, 255, .08); --block-shade: rgba(0, 0, 0, .38); --shade-gray: #2c2c2e;
  --icon: rgba(255, 255, 255, .5); --icon-block: #f8f8f8; --f-piano: #4a4250; --f-piano-hi: #6a6175; --f-shelf-in: #3c2716; --f-hi: rgba(255,255,255,.2); --victim: #f8f8f8; --victim-fg: #121213;
  --r0: #2b4866; --r1: #5d4128; --r2: #2e5636; --r3: #5a3247; --r4: #4c4a24; --r5: #403866; --r6: #5d5122; --r7: #225651;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Cabecera ---------- */
.hdr { border-bottom: 1px solid var(--line); }
.hdr-in {
  max-width: 1100px; margin: 0 auto; height: 60px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.hdr-side { display: flex; gap: 2px; align-items: center; }
.hdr-side.right { justify-content: flex-end; }
.title { margin: 0; font: 400 34px/1 var(--font-title); letter-spacing: .01em; text-align: center; }
.icon-btn {
  width: 40px; height: 40px; display: inline-grid; place-items: center; border: 0; border-radius: 4px; background: transparent;
  cursor: pointer; color: var(--fg);
}
.icon-btn:hover { background: var(--surface); }
.icon-btn:disabled { opacity: .3; cursor: default; background: transparent; }
.icon-btn svg { width: 24px; height: 24px; }

.app {
  max-width: 1100px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 48px;
  display: flex; flex-direction: column; gap: 14px;
}
.subhdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.case-meta { display: flex; flex-direction: column; min-width: 0; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.case-title { font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 4px; border: 0;
  background: var(--surface); font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; cursor: pointer;
}
.timer svg { width: 16px; height: 16px; color: var(--muted); }
.timer.paused { background: var(--yellow); color: #fff; }
.timer.paused svg { color: #fff; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 14px;
  border-radius: 4px; border: 0; background: var(--key); color: var(--key-fg); cursor: pointer;
  font-weight: 800; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap;
}
.btn svg { width: 17px; height: 17px; }
.btn:hover { filter: brightness(.96); }
.btn:active { transform: translateY(1px); }
.btn.green { background: var(--green); color: #fff; }
.btn.dark { background: var(--fg); color: var(--bg); }
.btn.red { background: var(--red); color: #fff; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--fg); }
.btn.pill { border-radius: 999px; height: 46px; padding: 0 26px; font-size: 15px; }
.btn:disabled { opacity: .4; cursor: not-allowed; filter: none; transform: none; }

/* ---------- Distribución ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start; }
.play { display: flex; flex-direction: column; gap: 12px; min-width: 0; width: 100%; max-width: 560px; margin: 0 auto; }
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (min-width: 980px) {
  .layout { grid-template-columns: auto minmax(340px, 1fr); gap: 40px; }
  .play {
    width: clamp(400px, min(calc(100vh - 330px), calc(100vw - 460px)), 600px); max-width: none; margin: 0;
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px);
  }
}

.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tool-group { display: flex; align-items: center; gap: 2px; }
.seg { display: inline-flex; gap: 4px; }
.seg button {
  height: 36px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 12px; letter-spacing: .05em; text-transform: uppercase;
  color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line);
}
.seg button svg { width: 16px; height: 16px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); box-shadow: none; }
.tool { position: relative; }
.badge {
  position: absolute; top: 2px; right: 0; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  background: var(--yellow); color: #fff; font-size: 10px; font-weight: 900; display: grid; place-items: center;
}

/* ---------- Plano de fichas ---------- */
.plan-frame { position: relative; }
.plan-grid { display: grid; grid-template-columns: 18px minmax(0, 1fr); grid-template-rows: 18px auto; gap: 4px; }
.coords { display: flex; font-size: 11px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.coords span { flex: 1; display: grid; place-items: center; }
.coords.rows { flex-direction: column; }
.board {
  --n: 6; --cell: 60px;
  position: relative; display: grid; width: 100%; aspect-ratio: 1;
  grid-template-columns: repeat(var(--n), 1fr); grid-template-rows: repeat(var(--n), 1fr);
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.cell {
  position: relative; border: 0; padding: 0; margin: 0; min-width: 0; min-height: 0; cursor: pointer;
  background-color: var(--room); -webkit-tap-highlight-color: transparent;
  transition: background-color .25s;
}
.cell.ir { background-image: linear-gradient(to left, var(--tile-line) 1px, transparent 1px); }
.cell.ib { background-image: linear-gradient(to top, var(--tile-line) 1px, transparent 1px); }
.cell.ir.ib { background-image: linear-gradient(to left, var(--tile-line) 1px, transparent 1px), linear-gradient(to top, var(--tile-line) 1px, transparent 1px); }
.cell.bt { margin-top: 2.5px; } .cell.bb { margin-bottom: 2.5px; } .cell.bl { margin-left: 2.5px; } .cell.br { margin-right: 2.5px; }
.cell:focus-visible { outline: none; }
.cell.blocked { cursor: not-allowed; box-shadow: inset 0 0 0 100vmax var(--block-shade); }
.cell.shaded { background-color: color-mix(in srgb, var(--room) 30%, var(--shade-gray)); }
.cell .obj { position: absolute; left: 11%; top: 11%; width: 78%; height: 78%; transition: all .2s; }
.cell.blocked .obj { filter: saturate(.85); }
.cell.has-token .obj { left: auto; top: auto; right: 3%; bottom: 3%; width: 32%; height: 32%; z-index: 3; filter: drop-shadow(0 0 1.5px rgba(0,0,0,.45)); }
.cell .xmark { position: absolute; left: 24%; top: 24%; width: 52%; height: 52%; color: var(--muted); opacity: 0; transform: scale(.5); transition: opacity .12s, transform .12s; }
.cell.has-x .xmark { opacity: 1; transform: none; }
.cell.has-x .obj { opacity: .3; }
.cell.x-wrong .xmark { color: var(--red); }
.notes { position: absolute; inset: 5%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); pointer-events: none; z-index: 2; }
.notes i { font: normal 900 calc(var(--cell) * .19)/1 var(--font-ui); display: grid; place-items: center; color: var(--pc); }
.cell.has-token .notes { display: none; }
.token {
  position: absolute; inset: 0; border-radius: inherit; display: none; place-items: center; z-index: 2;
  background: var(--pc); color: #fff; font: 900 calc(var(--cell) * .46)/1 var(--font-ui); text-transform: uppercase;
}
.token .face { position: absolute; inset: 0; width: 100%; height: 100%; }
.token .ini {
  position: absolute; left: 6%; bottom: 5%; z-index: 2; font: 900 calc(var(--cell) * .2)/1 var(--font-ui); color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,.45);
}
.token.victim .ini { display: none; }
.token.victim { background: var(--victim); color: var(--victim-fg); }
.cell.has-token .token { display: grid; animation: flip .42s ease-in; }
.cell.ghost .token { display: grid; opacity: .38; animation: none; }
.cell.hl::before, .cell.target::before, .cell.cand::before, .cell.roomhl::before, .cell.ring::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 4;
}
.cell.sel-token::before { content: ""; position: absolute; inset: 0; z-index: 4; box-shadow: inset 0 0 0 3px var(--fg); }
.cell.conflict::before, .cell.wrong::before { content: ""; position: absolute; inset: 0; z-index: 4; box-shadow: inset 0 0 0 3.5px var(--red); }
.cell.wrong .token { animation: shake .45s; }
.cell.cand::before { box-shadow: inset 0 0 0 2px var(--fg); background: color-mix(in srgb, var(--fg) 8%, transparent); }
.cell.hl::before { box-shadow: inset 0 0 0 3px var(--yellow); background: color-mix(in srgb, var(--yellow) 22%, transparent); }
.cell.roomhl::before { box-shadow: inset 0 0 0 2px var(--fg); }
.cell.target::before { box-shadow: inset 0 0 0 4px var(--green); animation: blink 1.1s ease-in-out infinite; }
.cell.murderer .token { background: var(--red); }
.cell.cursor::after { content: ""; position: absolute; inset: 2px; border: 2px dashed var(--fg); z-index: 5; pointer-events: none; }
body:not(.kbd) .cell.cursor::after { display: none; }
.board.win .cell { animation: bounce .55s ease calc(var(--d) * 1ms) both; }
.rlabel {
  position: relative; z-index: 6; pointer-events: none; align-self: start; justify-self: start; max-width: 100%;
  padding: 3px 5px; font-weight: 900; font-size: max(8px, calc(var(--cell) * .14)); letter-spacing: .05em; text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); opacity: .62; line-height: 1;
}
.board.paused .cell > *, .board.paused .rlabel { visibility: hidden; }
.pause-veil {
  position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; text-align: center; background: var(--overlay);
  font-weight: 900; font-size: 22px; text-transform: uppercase; letter-spacing: .08em; border-radius: 6px;
}
.pause-veil small { display: block; font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--muted); margin-top: 4px; }
.loader { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--bg); text-align: center; }
.loader .dots { display: flex; gap: 6px; justify-content: center; }
.loader .dots i { width: 34px; height: 34px; border-radius: 4px; background: var(--line); animation: loadflip 1.2s ease-in-out infinite; }
.loader .dots i:nth-child(2) { animation-delay: .15s; } .loader .dots i:nth-child(3) { animation-delay: .3s; }
.loader .dots i:nth-child(4) { animation-delay: .45s; } .loader .dots i:nth-child(5) { animation-delay: .6s; }
.loader p { margin: 14px 0 2px; font-weight: 800; font-size: 16px; }
.loader small { color: var(--muted); }

.statusline { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); min-height: 20px; }
.statusline b { color: var(--fg); }

/* Teclado de sospechosos */
.keys { --cols: 5; display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 6px; }
.key {
  height: 64px; border: 0; border-radius: 4px; background: var(--key); color: var(--key-fg); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 0; padding: 0 3px;
  transition: transform .08s, background-color .2s;
}
.key .kface { width: 32px; height: 32px; border-radius: 4px; overflow: hidden; background: var(--pc); display: block; }
.key.victim .kface { background: var(--victim); }
.key.placed .kface { box-shadow: 0 0 0 2px rgba(255,255,255,.55); }
.key .face { width: 100%; height: 100%; display: block; }
.key small { font-size: 11px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.key:active { transform: scale(.96); }
.key.placed { background: var(--pc); color: #fff; }
.key.victim.placed { background: var(--victim); color: var(--victim-fg); }
.key[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4.5px var(--fg); transform: translateY(-2px); }
.keys.nudge .key { animation: nudge .45s; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.legend button {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px 0 5px; border: 0; border-radius: 4px; cursor: pointer;
  background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); font-size: 12px; font-weight: 700;
}
.legend button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--fg); }
.legend i { width: 18px; height: 18px; border-radius: 3px; background: var(--sw); }

/* Pista */
.hint-panel { border-radius: 6px; background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; border-left: 5px solid var(--yellow); }
.hint-panel h3 { margin: 0; font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.hint-panel h3 svg { width: 16px; height: 16px; color: var(--yellow); }
.hint-panel p { margin: 0; max-width: 68ch; }
.hint-panel ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 5px; max-height: 260px; overflow: auto; font-size: 13px; }
.hint-panel .actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Expediente ---------- */
.case { display: flex; flex-direction: column; gap: 10px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.case h2 { margin: 0; font: 400 26px/1.1 var(--font-title); text-wrap: balance; }
.case p { margin: 0; max-width: 62ch; }
.case-stats { display: flex; gap: 6px; flex-wrap: wrap; }
.case-stats span { font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 4px; background: var(--surface); color: var(--muted); }
.case-stats b { color: var(--fg); font-variant-numeric: tabular-nums; }
.case .btn { align-self: flex-start; }
.section-label { margin: 4px 0 -4px; font-size: 12px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.people { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
@media (min-width: 640px) and (max-width: 979px) { .people { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; } }
.pcard {
  display: flex; flex-direction: column; gap: 6px; padding: 12px 8px 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; min-width: 0;
  border-radius: 0; transition: background-color .15s;
}
.pcard:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.pcard[aria-pressed="true"] { background: var(--surface); box-shadow: inset 4px 0 0 var(--fg); padding-left: 12px; }
.pcard.hinted { box-shadow: inset 4px 0 0 var(--yellow); padding-left: 12px; }
.pcard header { display: flex; align-items: center; gap: 10px; }
.pname { font-weight: 800; flex: 1; min-width: 0; }
.role { font-size: 10px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--red); }
.loc { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); min-width: 28px; text-align: right; }
.loc.on { color: var(--fg); }
.avatar {
  width: 38px; height: 38px; border-radius: 4px; display: inline-grid; place-items: center; flex: none;
  background: var(--pc); color: #fff; font-weight: 900; font-size: 16px; text-transform: uppercase;
}
.avatar.victim { background: var(--victim); color: var(--victim-fg); }
.avatar { overflow: hidden; }
.avatar .face { width: 100%; height: 100%; display: block; }
.clues { list-style: none; margin: 0; padding: 0 0 0 48px; display: flex; flex-direction: column; gap: 4px; }
.clues li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 14px; }
.clues li .st { width: 16px; height: 16px; margin-top: 2px; border-radius: 3px; background: var(--line); display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 900; line-height: 1; }

.clues li.bad .st::before { content: "✕"; font-size: 9px; }
.clues li.bad { color: var(--red); }
.hide-status .clues li .st { background: var(--line); }

.notes-card { padding: 12px 0; display: flex; flex-direction: column; gap: 8px; }

.notes-card .clues { padding-left: 0; }

.switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--line-2); transition: background .15s; }

.menu { position: absolute; z-index: 40; right: 0; top: calc(100% + 4px); min-width: 240px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 23px rgba(0,0,0,.15); padding: 4px; display: flex; flex-direction: column; }

@keyframes flip { 0% { transform: rotateX(-90deg); } 100% { transform: rotateX(0); } }

@keyframes fade { from { opacity: 0; } }
@keyframes slidein { from { opacity: 0; transform: translateY(30px); } }
@keyframes nudge { 0%, 100% { transform: none; } 30% { transform: translateY(-5px); } }
@keyframes loadflip { 0%, 60%, 100% { transform: rotateX(0); background: var(--line); } 30% { transform: rotateX(90deg); } 45% { background: var(--green); } }
@keyframes pop { 0% { transform: scale(.8); opacity: 0; } 40% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {

}

<header class="hdr">
  <div class="hdr-in">
    <div class="hdr-side">
      <button class="icon-btn" id="newBtn" type="button" title="Nuevo caso" aria-label="Nuevo caso"><svg><use href="#i-plus"/></svg></button>
      <button class="icon-btn" id="helpBtn" type="button" title="Cómo se juega" aria-label="Cómo se juega"><svg><use href="#i-help"/></svg></button>
    </div>
    <h1 class="title">Murdoku</h1>
    <div class="hdr-side right">
      <button class="icon-btn" id="statsBtn" type="button" title="Estadísticas" aria-label="Estadísticas"><svg><use href="#i-chart"/></svg></button>
      <button class="icon-btn" id="settingsBtn" type="button" title="Ajustes" aria-label="Ajustes"><svg><use href="#i-gear"/></svg></button>
    </div>
  </div>
</header>

<div class="app" id="app">
  <div class="subhdr">
    <div class="case-meta">
      <span class="eyebrow" id="caseEyebrow">Caso del día</span>
      <span class="case-title" id="caseTitle">Preparando la escena…</span>
    </div>
    <button class="timer" id="timerBtn" type="button" title="Pausar o seguir"><svg><use href="#i-clock"/></svg><span id="timer">00:00</span></button>
  </div>

  <main class="layout">
    <section class="play" aria-label="Plano de la casa">
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Modo de juego">
          <button type="button" data-mode="place" aria-pressed="true" title="Colocar personas (P)"><svg><use href="#i-hand"/></svg><span>Colocar</span></button>
          <button type="button" data-mode="x" aria-pressed="false" title="Tachar casillas (clic derecho o mantener pulsado)"><svg><use href="#i-x"/></svg><span>Tachar</span></button>
          <button type="button" data-mode="note" aria-pressed="false" title="Apuntar posibles (N)"><svg><use href="#i-pencil"/></svg><span>Notas</span></button>
        </div>
        <div class="tool-group">
          <button class="icon-btn" id="undoBtn" type="button" title="Deshacer (Ctrl+Z)" aria-label="Deshacer"><svg><use href="#i-undo"/></svg></button>
          <button class="icon-btn" id="redoBtn" type="button" title="Rehacer (Ctrl+Y)" aria-label="Rehacer"><svg><use href="#i-redo"/></svg></button>
          <button class="icon-btn tool" id="hintBtn" type="button" title="Pista (H)" aria-label="Pista"><svg><use href="#i-bulb"/></svg><span class="badge" id="hintBadge" hidden>0</span></button>
          <button class="icon-btn" id="checkBtn" type="button" title="Comprobar lo que llevo" aria-label="Comprobar"><svg><use href="#i-check"/></svg></button>
          <div style="position:relative">
            <button class="icon-btn" id="moreBtn" type="button" title="Más" aria-label="Más opciones" aria-haspopup="true" aria-expanded="false"><svg><use href="#i-more"/></svg></button>
            <div class="menu" id="moreMenu" hidden>
              <button type="button" data-act="copy"><svg><use href="#i-copy"/></svg>Copiar el código del caso</button>
              <button type="button" data-act="clearx"><svg><use href="#i-x"/></svg>Borrar tachones y notas</button>
              <hr>
              <button type="button" data-act="reset"><svg><use href="#i-reset"/></svg>Empezar de cero</button>
              <button type="button" data-act="reveal"><svg><use href="#i-eye"/></svg>Me rindo, ¿quién fue?</button>
            </div>
          </div>
        </div>
      </div>

      <div class="hint-panel" id="hintPanel" hidden aria-live="polite"></div>

      <div class="plan-frame">
        <div class="plan-grid">
          <span></span>
          <div class="coords" id="colCoords"></div>
          <div class="coords rows" id="rowCoords"></div>
          <div class="board" id="board" role="grid" aria-label="Plano"></div>
        </div>
        <div class="loader" id="loader">
          <div><div class="dots"><i></i><i></i><i></i><i></i><i></i></div><p id="loaderText">Escondiendo el cadáver…</p><small id="loaderSub">Repartiendo coartadas</small></div>
        </div>
      </div>

      <div class="statusline"><span id="statusText">Elige a alguien abajo y tócale un sitio en el plano.</span><span id="progressText"></span></div>
      <div class="keys" id="picker" aria-label="Sospechosos"></div>
      <div class="legend" id="legend" aria-label="Habitaciones"></div>
    </section>

    <aside class="side" aria-label="El caso">
      <section class="case">
        <h2 id="storyTitle">Un crimen en la mansión</h2>
        <p id="story"></p>
        <div class="case-stats" id="caseStats"></div>
        <button class="btn green pill" id="accuseBtn" type="button" disabled><svg><use href="#i-gavel"/></svg>Acusar</button>
      </section>
      <div class="section-label">Lo que dice cada uno</div>
      <div class="people" id="people"></div>
      <div class="notes-card" id="inspector"></div>
    </aside>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>

<script src="engine.js"></script>
<script src="faces.js"></script>
<script src="app.js"></script>

</body>
</html>
